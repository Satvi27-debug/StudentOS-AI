services:
  postgres:
    image: postgres:17-alpine
    container_name: studentos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: studentos
      POSTGRES_PASSWORD: studentos
      POSTGRES_DB: studentos
    ports:
      - "5432:5432"
    volumes:
      - studentos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studentos -d studentos"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  studentos_pgdata:
